[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgesrda"
version = "0.1.0"
description = "Forecast-informed stochastic interpolants for super-resolution data assimilation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.12,<3",
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["src*", "scripts*"]
exclude = ["src.*.__pycache__", "scripts.*.__pycache__"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
